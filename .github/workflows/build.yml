name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Decode icon
        shell: bash
        run: base64 -d icon.b64 > icon-app.png
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dukaan-windows
          path: |
            dist/Dukaan-Manager-Setup.exe
            dist/Dukaan-Manager-Portable.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" || gh release create "${{ github.ref_name }}" --title "Dukaan Manager ${{ github.ref_name }}" --notes "Windows installer (unsigned). Noman Powered by alpha blue"
          gh release upload "${{ github.ref_name }}" dist/Dukaan-Manager-Setup.exe dist/Dukaan-Manager-Portable.exe --clobber
